name = "cloudplay-host-coordinator"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Set HOST_TOKEN as a secret with: npx wrangler secret put HOST_TOKEN

[[durable_objects.bindings]]
name = "CLOUDPLAY_QUEUE"
class_name = "CloudPlayQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CloudPlayQueue"]
